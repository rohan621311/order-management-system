spring.application.name=order-management-system

spring.datasource.url=jdbc:oracle:thin:@m100:1521:frsp
spring.datasource.username=kps1
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.OracleLegacyDialect

logging.level.org.springframework.security=DEBUG

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.data.web.pageable.max-page-size=100

